<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cadastro de Produto</title>
</head>
<body>
    <main>
        <div class="menu">
            <h2>Cadastro de Produto</h2>
            <form id="formProduto">
                <label for="nome">Nome do Produto:</label>
                <input type="text" id="nome" required>
                
                <label>Categoria: </label>
                <select id="categoria">
                    <option value="eletronico">Eletrônico</option>
                    <option value="periferico">Periférico</option>
                </select>

                <label for="preco">Preço (R$):</label>
                <input type="number" id="preco" min="0" step="0.01">

                <button type="submit" id="btnSalvar">Salvar Produto</button>
            </form>

            <h2>Pesquisa</h2>
            <div class="buscarProduto">
                <div id="pesquisa">
                    <label>Nome do produto: </label>
                    <input id="busca">
                </div>
                <label>Categorias: </label>
                <div id="categorias">
                    <button class="btnCategoria">Todos</button>
                    <button class="btnCategoria">Eletrônico</button>
                    <button class="btnCategoria">Periférico</button>
                </div>
            </div>
        </div>

        <div class="produtos">
            <h2>Produtos</h2>
            <h3>Lista de produtos filtrados</h3>
            <div class="listaProdutos">

            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
